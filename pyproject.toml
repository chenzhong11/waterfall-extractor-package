[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "waterfall-extractor"
version = "1.0.0"
description = "Integration-oriented spectrum waterfall/cascade feature extraction package for vibration signals."
readme = "README_EN.md"
license = { text = "MIT" }
authors = [{ name = "Hao Wei" }]
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
]

[tool.setuptools.packages.find]
include = ["waterfall_extractor*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
